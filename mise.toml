[tools]
rtk = "0.49.0"
lefthook = "2.1.14"
node = "26.10.0"
pnpm = "12.6.0"
# Quintのモデル検査(Apalache，TLC)が使う．
java = "temurin-21"
# 版を変えたら`mise lock`を実行し，生成されたmise.lockもコミットする．

[settings]
lockfile = true

[tasks.install]
description = "依存パッケージをインストールする"
run = "pnpm install --frozen-lockfile"

[tasks.fmt]
description = "文書を整形する(textlintで自動で直せる指摘を直す)"
depends = ["install"]
run = "git ls-files '*.md' -z | xargs -0 -r pnpm exec textlint --fix"

[tasks.lint]
description = "文書，Mermaidの図，TypeScriptを検査する"
depends = ["install"]
run = "pnpm lint"

[tasks.test]
description = "すべてのIterationの仕様を検査する"
depends = ["install"]
run = "node tools/check.ts"

[tasks.verify]
description = "指定したディレクトリの仕様を検査する(例: mise run verify iterations/iteration-0/exercise)"
depends = ["install"]
run = "node tools/check.ts"

[tasks.diagram]
description = "指定したディレクトリの状態遷移図を生成し直す(例: mise run diagram iterations/iteration-0/exercise)"
depends = ["install"]
run = "node tools/diagram.ts"

[tasks.hooks]
description = "Gitのフック(コミット時の検査)を設定する"
run = "lefthook install"

[tasks.setup]
description = "開発環境を整える(依存パッケージ，Gitのフックなど)"
depends = ["install", "hooks"]

[tasks.check]
description = "リントとすべての仕様の検査をまとめて実行する(CIと同じ)"
depends = ["lint", "test"]
